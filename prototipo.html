<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototipo | Rueda Nocturna</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ruta: '#1E7A4F',
            pedal: '#F39A2B',
            noche: '#14213D',
            crema: '#FAF6EF',
            asfalto: '#5B6470',
            farol: '#FFD166',
          },
          fontFamily: {
            titulos: ['Montserrat', 'Arial', 'sans-serif'],
            texto: ['"Open Sans"', 'Helvetica', 'sans-serif'],
          },
        },
      },
    }
  </script>
</head>
<body class="min-h-screen bg-crema font-texto text-noche">

  <main class="mx-auto max-w-3xl p-6">
    <section class="space-y-6 rounded-2xl bg-noche p-8 text-crema">

      <p class="inline-block rounded-full bg-farol px-4 py-1 text-sm font-semibold uppercase tracking-wider text-noche">

      <h1 class="font-titulos text-5xl font-extrabold leading-tight tracking-tight">

      <div class="flex flex-wrap gap-4">
        <div class="w-40 rounded-xl border border-crema/20 p-4">
          <p class="font-titulos text-3xl font-bold text-farol">3 rutas</p>
        </div>
        <div class="w-48 rounded-xl border border-crema/20 p-4">
          <p class="font-titulos text-3xl font-bold text-farol">Desde $55.000</p>
        </div>
      </div>

      <a href="../rueda-libre/paginas/reservas.html"
         class="inline-block rounded-lg bg-pedal px-6 py-3 font-semibold uppercase tracking-wide text-noche hover:bg-farol">
        Inscríbete

    </section>
  </main>

</body>
</html>
