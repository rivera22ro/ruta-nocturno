<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header class="bg-green-600 m-3 rounded-lg w-fit mx-auto p-4">
        <h1 class="text-white text-center">Rutas</h1>
        <p class="text-white">"Descubre Medellín en bici cuando se encienden las luces"</p>
    </header>
    <main> 
        <article class=" bg-red-100 m-4 p-4 rounded-lg mx-auto w-fit  flex gap-6">

        <div class="m-4 p-4 rounded-lg bg-green-200 shadow-lg w-72">
            <h2 class="p-4 ">Luces del Centro</h2>
            <section>
                <img src="./img/centro.jpeg" alt="Ruta nocturna centro" class="mx-auto object-cover">
                <span class="bg-green-300 hover:bg-green-600 text-green-800 px-3 py-1 rounded-full m-4"> Nivel fácil</span>
            </section>
        </div>

        <div class="m-4 p-4 rounded-lg bg-green-200 shadow-lg w-72">
            <h2 class="p-4 ">Miradores de la Ciudad</h2>
            <section>
                <img src="./img/miradores.jpeg" alt="Miradores de la Ciudad"   class=" mx-auto object-cover">
                <span class="bg-yellow-200 hover:bg-yellow-600 text-yellow-800 px-3 py-1 rounded-full m-4 p-4"> Nivel intermedio</span>
            </section>
        </div>

        <div class="m-4 p-4 rounded-lg bg-green-200 shadow-lg w-72">
            <h2 class="p-4 ">Luna en Las Palmas</h2>
            <section>
                <img src="./img/palmas.jpeg" alt="Luna en Las Palmas" class="mx-auto object-cover">
                <span class="bg-red-200 hover:bg-red-600 text-red-800 px-3 py-1 rounded-full m-4"> Nivel difícil</span>
            </section>
        </div>

         </article>   


        
    </main>
    
</body>
</html>
